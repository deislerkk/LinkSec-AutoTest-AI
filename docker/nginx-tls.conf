# ─────────────────────────────────────────────────────────────────────────────
# LinkSec·AutoTest AI — Nginx HTTPS/TLS 示例（v3.7 安全加固）
# 用法：替换证书路径后，将本文件置于 /etc/nginx/conf.d/linksec-tls.conf
# 并停用原 80 端口配置（或保留 80 仅做跳转）。
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name _;

    # 证书：替换为正式证书或自签证书路径
    ssl_certificate     /etc/nginx/ssl/linksec.crt;
    ssl_certificate_key /etc/nginx/ssl/linksec.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    charset utf-8;
    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' data:; img-src 'self' data: https:; connect-src 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
    }
}

# 可选：80 端口统一跳转 HTTPS
# server {
#     listen 80;
#     return 301 https://$host$request_uri;
# }
