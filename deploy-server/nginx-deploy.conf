# ─────────────────────────────────────────────────────────────────────────────
# LinkSec·AutoTest AI — 私有部署源（Nginx 只读静态托管）v3.3.1
# 放置：/etc/nginx/conf.d/linksec-deploy.conf
# 校验：nginx -t && nginx -s reload
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 8443 ssl;                # 独立端口，避开 80/443（无备案域名时 80/443 会被云商拦截）
    server_name _;

    # 证书：替换为实际路径（可用自签或正式证书；有效期需关注续期）
    ssl_certificate     /etc/nginx/ssl/deploy.crt;
    ssl_certificate_key /etc/nginx/ssl/deploy.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 部署包根目录（只读托管）
    root  /srv/linksec-deploy;
    charset utf-8;

    # 禁止目录浏览
    autoindex off;

    # 只允许 GET；其余方法一律拒绝
    limit_except GET { deny all; }

    # 统一关闭缓存，确保客户端总能拿到最新清单
    add_header Cache-Control "no-cache";

    # 访问日志单独归档（便于审计下载行为）
    access_log /var/log/nginx/linksec-deploy.log;

    # 仅放行已知文件名：版本清单 / 变更日志 / 部署包
    # （新版本上线后若文件名包含新标记，需同步扩展此正则）
    location ~ ^/(latest\.json|CHANGELOG\.md|LinkSec_AutoTest_AI_[A-Za-z0-9._-]+\.zip)$ {
        try_files $uri =404;
    }

    # 其余一切路径拒绝（防目录穿越 / 防探测）
    location / { deny all; }

    # 显式拦截路径穿越
    location ~* \.\. { deny all; }
}
